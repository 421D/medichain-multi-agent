# Serve the React SPA + reverse-proxy /api and /ws to the backend container.
# Hostname `backend` resolves via the compose network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache for hashed filenames Vite emits
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — any non-API route serves index.html so React Router works on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;     # LangGraph runs can be slow
        proxy_send_timeout 300s;
    }

    # WebSocket (real-time agent events)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;    # idle WS may stay open during agent work
        proxy_send_timeout 3600s;
    }

    # Health endpoint forwarded for compose-level uptime probes
    location /health {
        proxy_pass http://backend:8000/health;
    }
}
