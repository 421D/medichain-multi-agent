name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          # Tests don't need real API keys (LLM calls are mocked or skipped),
          # but config.Settings refuses to construct without these env vars
          # being present. Empty strings are fine.
          KIMI_API_KEY: ""
          MEDICHAIN_LLM_MODEL: "kimi"
        run: pytest --cov --cov-report=term --cov-report=xml -q

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v3-creative
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-v3-creative/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run vitest
        run: npm test

      - name: Build production bundle (smoke)
        run: npm run build

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t medichain-backend:ci .
